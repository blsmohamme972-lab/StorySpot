name: Build StorySpot Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source and native tests
        shell: bash
        run: |
          set -euo pipefail
          python3 android/tests/test_asset_policy.py
          mkdir -p build/range-tests
          java -m jdk.compiler/com.sun.tools.javac.Main -d build/range-tests \
            android/src/com/storyspot/app/ByteRange.java \
            android/src/com/storyspot/app/PlaybackFocus.java \
            android/src/com/storyspot/app/BoundedInput.java \
            android/src/com/storyspot/app/MediaIntegrity.java \
            android/tests/ByteRangeTest.java \
            android/tests/PlaybackFocusTest.java \
            android/tests/MediaStreamTest.java
          java -cp build/range-tests com.storyspot.app.ByteRangeTest
          java -cp build/range-tests com.storyspot.app.PlaybackFocusTest
          java -cp build/range-tests com.storyspot.app.MediaStreamTest
      - name: Restore original private signing identity
        env:
          STORYSPOT_SIGNING_BACKUP_B64: ${{ secrets.STORYSPOT_SIGNING_BACKUP_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$STORYSPOT_SIGNING_BACKUP_B64" ]; then
            echo "::error::Missing encrypted secret STORYSPOT_SIGNING_BACKUP_B64. Do not use a new key for updates."
            exit 1
          fi
          mkdir -p ../.storyspot-signing ../shared/storyspot-private
          chmod 700 ../.storyspot-signing ../shared/storyspot-private
          printf '%s' "$STORYSPOT_SIGNING_BACKUP_B64" | base64 --decode > ../shared/storyspot-private/storyspot-signing-backup.zip
          chmod 600 ../shared/storyspot-private/storyspot-signing-backup.zip
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          source=Path('../shared/storyspot-private/storyspot-signing-backup.zip')
          target=Path('../.storyspot-signing')
          with zipfile.ZipFile(source) as archive:
              for name in ('storyspot-release.p12','keystore-password.txt'):
                  info=archive.getinfo(name)
                  if info.is_dir() or info.file_size > 100000:
                      raise ValueError('Invalid signing backup member')
                  data=archive.read(name)
                  path=target/name
                  path.write_bytes(data)
                  path.chmod(0o600)
          PY
      - name: Install pinned Android SDK
        run: python3 tools/bootstrap-sdk.py
      - name: Build and verify signed APK
        run: python3 tools/build-apk.py
      - name: Upload signed APK and verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: StorySpot-1.1.2-signed
          path: |
            dist/StorySpot-1.1.2.apk
            dist/StorySpot-1.1.2.apk.sha256
            dist/StorySpot-1.1.2.apk.json
          if-no-files-found: error
          retention-days: 14
